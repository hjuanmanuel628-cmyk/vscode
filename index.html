<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joyería - Registro de Ventas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Registro de Ventas de Joyería</h1>
        </header>

        <section class="form-section">
            <h2>Nueva Venta</h2>
            <form id="sales-form">
                <div class="form-group">
                    <label for="item-photo">Foto de la prenda:</label>
                    <input type="file" id="item-photo" accept="image/*" capture="environment" required>
                    <div id="image-preview-container" class="hidden">
                        <img id="image-preview" src="" alt="Vista previa">
                    </div>
                </div>

                <div class="form-group">
                    <label for="item-name">Nombre/Descripción:</label>
                    <input type="text" id="item-name" required placeholder="Ej. Anillo de oro 18k">
                </div>

                <div class="form-group">
                    <label for="cost-price">Costo ($):</label>
                    <input type="number" id="cost-price" min="0" step="0.01" required placeholder="Costo de la prenda">
                </div>

                <div class="form-group">
                    <label for="sale-price">Precio de Venta ($):</label>
                    <input type="number" id="sale-price" min="0" step="0.01" required placeholder="Precio al que se vendió">
                </div>

                <button type="submit" class="btn">Registrar Venta</button>
            </form>
        </section>

        <section class="sales-list-section">
            <h2>Ventas Registradas</h2>
            <div id="sales-list" class="sales-grid">
                <!-- Sales cards will be injected here -->
            </div>
            <button id="clear-all" class="btn btn-danger">Borrar Todo</button>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
